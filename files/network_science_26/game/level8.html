<script>
/* =====================================================================
   NEXUS · Level 8 (finale of part one): THE CORE
   a recap of lectures 1–7 and a long final boss on a single network
   ===================================================================== */
const ST={S:0,I:1,R:2,V:3}, SCOL=[COL.cyan,COL.mag,COL.dim,COL.green], GCOL=[COL.cyan,COL.mag,COL.violet,COL.amber,COL.green];
// --- algorithms from the previous levels
function h01(a,b,c,s=0){ let h=(a*73856093)^(b*19349663)^(c*83492791)^(s*2654435761); h=Math.imul(h^h>>>16,0x45d9f3b); h=Math.imul(h^h>>>16,0x45d9f3b); h^=h>>>16; return (h>>>0)/4294967296; }
function sirStep(adj, st, t, beta, mu, s=0){ const inf=[]; st.forEach((x,i)=>{ if(x===ST.I) inf.push(i); }); const nw=[];
  for(const i of inf) for(const j of adj[i]) if(st[j]===ST.S && h01(i,j,t,s)<beta && !nw.includes(j)) nw.push(j);
  for(const i of inf) if(h01(i,i,t,s+7)<mu) st[i]=ST.R; nw.forEach(j=>st[j]=ST.I); return st; }
function spreadSize(adj, seeds, beta, mu, s, off){ const N=adj.length, st=Array(N).fill(ST.S); if(off) off.forEach(i=>st[i]=ST.V); const ever=new Set();
  seeds.forEach(x=>{ if(st[x]===ST.S){ st[x]=ST.I; ever.add(x); } }); let t=0;
  while(st.includes(ST.I)&&t<300){ sirStep(adj,st,t,beta,mu,s); st.forEach((x,i)=>{ if(x===ST.I) ever.add(i); }); t++; } return ever.size; }
function pagerank(N, D, beta=.15){ const out=Array.from({length:N},()=>[]); D.forEach(([a,b])=>out[a].push(b)); let p=Array(N).fill(1/N);
  for(let it=0;it<120;it++){ const q=Array(N).fill(0); let dang=0; for(let i=0;i<N;i++){ if(out[i].length) out[i].forEach(j=>q[j]+=(1-beta)*p[i]/out[i].length); else dang+=p[i]; }
    for(let i=0;i<N;i++) q[i]+=beta/N+(1-beta)*dang/N; p=q; } return p; }
function betweenness(N, adj){ const C=Array(N).fill(0);
  for(let s=0;s<N;s++){ const St=[], P=Array.from({length:N},()=>[]), sig=Array(N).fill(0), d=Array(N).fill(-1); sig[s]=1; d[s]=0; const Q=[s];
    while(Q.length){ const v=Q.shift(); St.push(v); for(const w of adj[v]){ if(d[w]<0){ d[w]=d[v]+1; Q.push(w); } if(d[w]===d[v]+1){ sig[w]+=sig[v]; P[w].push(v); } } }
    const dl=Array(N).fill(0); while(St.length){ const w=St.pop(); for(const v of P[w]) dl[v]+=sig[v]/sig[w]*(1+dl[w]); if(w!==s) C[w]+=dl[w]; } }
  return C.map(x=>x/2); }
function closeness(N, adj){ return d3range(N).map(i=>{ const d=bfs(adj,i).d; const s=d.reduce((a,x)=>a+(x>0?x:0),0); return s?(N-1)/s:0; }); }
function eigenvector(N, adj, it=100){ let x=Array(N).fill(1); for(let k=0;k<it;k++){ const y=x.map((v,i)=>v+adj[i].reduce((a,j)=>a+x[j],0)); const m=Math.max(...y)||1; x=y.map(v=>v/m); } return x; }
function modularity(N, E, lab){ const m=E.length; if(!m) return 0; const deg=degrees(N,E), L={}, K={};
  E.forEach(([a,b])=>{ if(lab[a]===lab[b]) L[lab[a]]=(L[lab[a]]||0)+1; }); for(let i=0;i<N;i++) K[lab[i]]=(K[lab[i]]||0)+deg[i];
  let q=0; for(const c in K) q+=(L[c]||0)/m-Math.pow(K[c]/(2*m),2); return q; }
const overlap=(adj,i,j)=>{ const ni=new Set(adj[i]), c=adj[j].filter(x=>ni.has(x)).length, den=(adj[i].length-1)+(adj[j].length-1)-c; return den>0?c/den:0; };
const norm=v=>{ const m=Math.max(...v)||1; return v.map(x=>x/m); };

// --- the Core: preferential attachment inside groups (homophily) + triadic closure: hubs, communities and triangles at once
function coreNet(G, n, pin, pm, ptri, seed){ const R=rng(seed), grp=[], adj=[], E=[], has=new Set();
  const add=(a,b)=>{ if(a===b||has.has(ekey(a,b))) return false; has.add(ekey(a,b)); adj[a].push(b); adj[b].push(a); E.push([a,b]); return true; };
  const node=g=>{ grp.push(g); adj.push([]); return grp.length-1; };
  for(let g=0;g<G;g++){ const a=node(g), b=node(g), c=node(g); add(a,b); add(b,c); add(a,c); }
  for(let g=0;g<G;g++) add(3*g, 3*((g+1)%G)+1);
  const pick=g=>{ let tot=0; const c=[]; for(let i=0;i<grp.length;i++) if(grp[i]===g){ tot+=adj[i].length; c.push(i); } let u=R()*tot; for(const i of c){ u-=adj[i].length; if(u<=0) return i; } return c[c.length-1]; };
  while(grp.length<G*n){ const g=grp.length%G, v=node(g), m=R()<pm?2:1; let first=-1, made=0, tries=0;
    while(made<m&&tries<50){ tries++; let t;
      if(first>=0&&R()<ptri){ const nb=adj[first].filter(x=>x!==v); t=nb[Math.floor(R()*nb.length)]; }
      else { const og=R()<pin?g:((g+1+Math.floor(R()*(G-1)))%G); t=pick(og); }
      if(t!=null&&add(v,t)){ made++; if(first<0) first=t; } } }
  return {N:grp.length, E, adj, grp}; }
// reports inside the cell: mostly towards the controller (by distance), some the other way, some both ways
function reportNet(E, Tl, x, seed, pto=.85, prec=.25){ const n=Tl.length, ix=new Map(Tl.map((v,k)=>[v,k])), Ein=E.filter(([a,b])=>ix.has(a)&&ix.has(b)).map(([a,b])=>[ix.get(a),ix.get(b)]);
  const R=rng(seed), d=bfs(adjOf(n,Ein),ix.get(x)).d, D=[];
  Ein.forEach(([a,b])=>{ let [u,v]=d[a]>d[b]?[a,b]:d[b]>d[a]?[b,a]:(R()<.5?[a,b]:[b,a]); if(R()>pto) [u,v]=[v,u]; D.push([u,v]); if(R()<prec) D.push([v,u]); });
  return D.map(([u,v])=>[Tl[u],Tl[v]]); }
// two contagions racing (the kill-patch = 1, NEXUS = 2), SI-like: a device taken by one cannot be taken by the other
function race(adj, pS, nS, off, bp, bn, s, rec){ const N=adj.length, st=Array(N).fill(0); off.forEach(i=>st[i]=3); nS.forEach(i=>{ if(!st[i]) st[i]=2; }); pS.forEach(i=>{ if(!st[i]) st[i]=1; }); if(rec) rec.push(st.slice());
  for(let t=0;t<200;t++){ const claim=new Map(); let any=false;
    for(let i=0;i<N;i++){ const c=st[i]; if(c!==1&&c!==2) continue; for(const j of adj[i]){ if(st[j]) continue; any=true; if(h01(i,j,t,s+c*11)<(c===1?bp:bn)){ const o=claim.get(j); claim.set(j, o&&o!==c ? (h01(j,j,t,s)<.5?1:2) : c); } } }
    claim.forEach((c,j)=>st[j]=c); if(rec&&claim.size) rec.push(st.slice()); if(!any) break; }
  let p=0,x=0; st.forEach(v=>{ if(v===1)p++; else if(v===2)x++; }); return p/(p+x); }

// clean the planted groups: move single devices to the group that raises the modularity most, until nothing moves
function qRefine(G){ const N=G.N, lab=G.grp.slice(); let q=modularity(N,G.E,lab), moved=true;
  while(moved){ moved=false; for(let i=0;i<N;i++){ let bl=lab[i], bq=q; const o=lab[i];
    for(const c of new Set(G.adj[i].map(j=>lab[j]))){ if(c===o) continue; lab[i]=c; const nq=modularity(N,G.E,lab); if(nq>bq+1e-9){ bq=nq; bl=c; } } lab[i]=bl; if(bl!==o){ q=bq; moved=true; } } }
  return lab; }
const CORE=(()=>{ const G0=coreNet(5,32,.88,.55,.5,87), G={...G0, grp:qRefine(G0)}, N=G.N, deg=G.adj.map(a=>a.length);
  const T=new Set(d3range(N).filter(i=>G.grp[i]===2)), X=27, START=35, GATE=7;
  const D=reportNet(G.E,[...T],X,8), bnd=G.E.filter(([a,b])=>T.has(a)!==T.has(b));
  let cl=0; for(let i=0;i<N;i++){ const a=G.adj[i]; if(a.length<2) continue; let t=0; for(let x=0;x<a.length;x++) for(let y=x+1;y<a.length;y++) if(G.adj[a[x]].includes(a[y])) t++; cl+=t/(a.length*(a.length-1)/2); }
  let L=0, c=0; for(let s=0;s<N;s++) bfs(G.adj,s).d.forEach(x=>{ if(x>0){ L+=x; c++; } });
  const out=d3range(N).filter(i=>!T.has(i)), SLEEP=[0,1,3].map(g=>out.filter(i=>G.grp[i]===g&&deg[i]>=3&&deg[i]<=5)).map((c,k)=>c[Math.floor(h01(k,3,9)*c.length)]);
  return {...G, deg, T, X, START, GATE, D, bnd, SLEEP, C:cl/N, L:L/c, k:2*G.E.length/N, kmax:Math.max(...deg)}; })();
let PCORE=null; const corePos=()=>PCORE||(PCORE=tame(layout(CORE.N,CORE.E,5,420,.25),.92,1.1));
const csize=i=>2+Math.sqrt(CORE.deg[i])*1.25;
// log-binned degree distribution, for log-log plots
function logHist(deg){ const N=deg.length, out=[]; for(let lo=1;lo<=64;lo*=2){ const c=deg.filter(k=>k>=lo&&k<2*lo).length; if(c) out.push([Math.sqrt(lo*(2*lo-1)), c/lo/N]); } return out; }
function drawLogLog(ctx,R,pts,col,lab){ const [x0,y0,W,H]=R, lx=Math.log10, xmn=0, xmx=lx(64), ymn=lx(1e-4), ymx=0;
  const X=v=>x0+W*(lx(v)-xmn)/(xmx-xmn), Y=v=>y0+H*(1-(lx(v)-ymn)/(ymx-ymn));
  seg(ctx,[x0,y0+H],[x0+W,y0+H],COL.ink2,1); seg(ctx,[x0,y0],[x0,y0+H],COL.ink2,1);
  label(ctx,'k (log)',x0+W-24,y0+H+11,COL.ink2,10); label(ctx,'P(k) (log)',x0+30,y0-8,COL.ink2,10);
  pts.forEach(([k,p],i)=>{ if(i) seg(ctx,[X(pts[i-1][0]),Y(pts[i-1][1])],[X(k),Y(p)],col,1.5,.6); dot(ctx,X(k),Y(p),4,col,8); });
  if(lab) label(ctx,lab,x0+W/2,y0+H+24,col,11); }

// --- degree as size; shortest paths light up one after the other
ANIM.d1=(C,cap)=>{ const pairs=[[35,7],[150,120],[79,107],[12,140]].map(([a,b])=>pathTo(bfs(CORE.adj,a).par,b));
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const p=coreBox(C), k=Math.floor(t/3500)%pairs.length, P=pairs[k], f=clamp((t%3500)/2200,0,1), m=Math.floor(f*(P.length-1));
    CORE.E.forEach(([a,b])=>seg(ctx,p[a],p[b],COL.cyan,1,.25));
    for(let i=0;i<m;i++) seg(ctx,p[P[i]],p[P[i+1]],COL.amber,3,.9);
    p.forEach(([x,y],i)=>dot(ctx,x,y,csize(i),P.slice(0,m+1).includes(i)?COL.amber:COL.cyan,4));
    cap.innerHTML=`${CORE.N} nodes · ${CORE.E.length} links · size = degree · <span style="color:var(--amber)">shortest path: d = ${P.length-1}</span>`; }; };
// --- the Core next to a random network with the same N and E
ANIM.d2=(C,cap)=>{ const N=CORE.N, R=rng(8), pr=[]; for(let a=0;a<N;a++) for(let b=a+1;b<N;b++) pr.push([a,b,R()]); pr.sort((x,y)=>x[2]-y[2]);
  const RE=pr.slice(0,CORE.E.length).map(([a,b])=>[a,b]), radj=adjOf(N,RE), rdeg=radj.map(a=>a.length), PR=tame(layout(N,RE,3,300,.25),.9,1.1);
  let rc=0; for(let i=0;i<N;i++){ const a=radj[i]; if(a.length<2) continue; let t=0; for(let x=0;x<a.length;x++) for(let y=x+1;y<a.length;y++) if(radj[a[x]].includes(a[y])) t++; rc+=t/(a.length*(a.length-1)/2); } rc/=N;
  const big=comps(N,RE).bigSize;
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const rnd=Math.floor(t/5000)%2===1;
    const p=rnd?inBox(PR,[0,22,w,h-32],14,1.6):coreBox(C), E=rnd?RE:CORE.E, dg=rnd?rdeg:CORE.deg, col=rnd?COL.ink2:COL.cyan;
    E.forEach(([a,b])=>seg(ctx,p[a],p[b],col,1,.3)); p.forEach(([x,y],i)=>dot(ctx,x,y,2+Math.sqrt(dg[i])*1.25,rnd?COL.ink:COL.cyan,4));
    cap.innerHTML = rnd ? `RANDOM, same N and E · C = ${rc.toFixed(2)} · biggest hub ${Math.max(...rdeg)} · giant component ${big}/${N}`
                        : `<span style="color:var(--cyan)">THE CORE</span> · C = ${CORE.C.toFixed(2)} · biggest hub ${CORE.kmax} · L = ${CORE.L.toFixed(1)}`; }; };
// --- hubs and the log-log degree distribution
ANIM.d3=(C,cap)=>{ const hubs=d3range(CORE.N).sort((a,b)=>CORE.deg[b]-CORE.deg[a]).slice(0,6), H=logHist(CORE.deg);
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const p=coreBox(C), g=.5+.5*Math.sin(t/300);
    CORE.E.forEach(([a,b])=>{ const hh=hubs.includes(a)||hubs.includes(b); seg(ctx,p[a],p[b],hh?COL.amber:COL.cyan,1,hh?.45:.2); });
    p.forEach(([x,y],i)=>{ const hh=hubs.includes(i); dot(ctx,x,y,csize(i)+(hh?1+g:0),hh?COL.amber:COL.cyan,hh?12:3); });
    const bw=Math.min(150,w*.38), bh=bw*.8; ctx.save(); ctx.fillStyle='rgba(7,11,18,.85)'; ctx.fillRect(w-bw-18,h-bh-44,bw+14,bh+38); ctx.restore();

    cap.innerHTML=`<span style="color:var(--amber)">hubs</span>: the 6 biggest have ${hubs.map(i=>CORE.deg[i]).join(', ')} links · inset: P(k), log-log`; }; };
// --- four centralities on the same network
ANIM.d4=(C,cap)=>{ const N=CORE.N, adj=CORE.adj, L=[['DEGREE',norm(CORE.deg),COL.cyan],['BETWEENNESS',norm(betweenness(N,adj)),COL.amber],['CLOSENESS',null,COL.green],['EIGENVECTOR',null,COL.violet]];
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const k=Math.floor(t/4000)%4, l=L[k];
    if(!l[1]) l[1]=k===2?norm(closeness(N,adj).map(x=>Math.pow(x,3))):norm(eigenvector(N,adj)); const v=l[1], top=v.indexOf(1), p=coreBox(C);

ANIM.d5=(C,cap)=>{ const q=modularity(CORE.N,CORE.E,CORE.grp);
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const p=coreBox(C), f=clamp((t%8000)/3000,0,1);

// --- an outbreak runs through the Core
ANIM.d6=(C,cap)=>{ const N=CORE.N, st=Array(N).fill(ST.S), s0=CORE.START; st[s0]=ST.I; const fr=[st.slice()]; for(let t=0;t<60&&st.includes(ST.I);t++){ sirStep(CORE.adj,st,t,.35,.3,4); fr.push(st.slice()); }

    const ever=new Set(); fr.slice(0,f+1).forEach(x=>x.forEach((q,i)=>{ if(q===ST.I) ever.add(i); }));

/* =====================================================================
   LIGHTNING ROUND: timed questions, faster answers are worth more
   ===================================================================== */
BUILD.lightning=sc=>{
  const TL=25, n=sc.items.length; setNext('NEXT ▸', true);
  stage.appendChild(el('div','h',`<small>// ${sc.tag}</small>${sc.title}`));
  stage.appendChild(el('div','vera',`<b>VERA:</b> ${sc.vera}`));
  const wrap=el('div'); stage.appendChild(wrap); let i=0, got=0, right=0;
  const show=()=>{ dbg('Q'+(i+1)); const it=sc.items[i]; wrap.innerHTML='';
    const c=el('div','qcard fade'); c.appendChild(el('div','qn',`LIGHTNING ${i+1} / ${n} · ${it.lec}`));
    const tb=el('div','tbar'), bar=el('i'); tb.appendChild(bar); c.appendChild(tb);
    c.appendChild(el('div','qtext',it.q)); const opts=el('div','opts'), fb=el('div','fb'); const bs=[];
    let t0=performance.now(), done=false;
    const end=k=>{ if(done) return; done=true; cur.draw=null; bs.forEach((b,j)=>{ b.disabled=true; if(j===it.a) b.className='ok'; else if(j===k) b.className='no'; });
      if(k===it.a){ const rem=Math.max(0,TL-(performance.now()-t0)/1000), pts=4+Math.ceil(4*rem/TL), g=award(sc.key+i,pts); right++; got+=pts;
        fb.className='fb ok'; fb.innerHTML=`> right: ${it.why} ${g?'<b>+'+pts+' XP</b>':''}`; }
      else { fb.className='fb no'; fb.innerHTML=`> ${k<0?'time is up':'no'}. ${it.why}`; }
      tex(fb); const last=i===n-1, nb=el('button','btn-main', last?'RESULTS ▸':'NEXT ▸'); nb.style.minHeight='48px';
      nb.onclick=()=>{ if(last) results(); else { i++; show(); } stage.scrollTop=0; }; c.appendChild(nb); };
    it.o.forEach((o,k)=>{ const b=el('button',null,o); b.onclick=()=>end(k); bs.push(b); opts.appendChild(b); });
    c.append(opts,fb); wrap.appendChild(c); tex(c);
    cur.draw=()=>{ if(done) return; const f=1-(performance.now()-t0)/1000/TL; bar.style.width=Math.max(0,f*100)+'%'; tb.classList.toggle('low',f<.25); if(f<=0) end(-1); }; };
  const results=()=>{ cur.draw=null; wrap.innerHTML=''; const c=el('div','qcard fade');
    c.innerHTML=`<div class="qn">LIGHTNING ROUND · RESULTS</div><div class="qtext"><b>${right} / ${n}</b> right, ${got} points in this run.</div><div class="tip" style="color:var(--ink2);font-size:14px">XP are earned only the first time you get a question right. Replay to fill the gaps, or move on to the mission.</div>`;
    const rb=el('button',null,'↻ REPLAY'); rb.style.minHeight='48px'; rb.onclick=()=>{ i=0; got=0; right=0; show(); }; c.appendChild(rb); wrap.appendChild(c); };
  show(); };

/* =====================================================================
   BOSS · OPERATION CORE (six phases, one detection meter, checkpoints)
   ===================================================================== */
BUILD.boss=()=>{
  const key='boss', N=CORE.N, T=CORE.T, FAIL=15;
  setNext('DEBRIEF ▸', key in S.xp);
  const head=el('div','bosshead'); head.innerHTML=`<div class="h"><small>// FINAL MISSION</small>OPERATION CORE</div>`; const tag=el('div','timer calm','PHASE 1/6'); head.appendChild(tag); stage.appendChild(head);

  const task=el('div','task'); stage.appendChild(task);

  let R=S.run&&!S.run.done&&S.run.v===3?S.run:null; if(!R){ R=S.run={v:3,ph:1,det:0,cp:0,sc:[],fails:0,esc:[]}; save(); }
  let tapH=null, locked=false;
  const C=canvasIn(pN,(x,y)=>{ if(locked||!tapH) return; if(C.w&&cur.draw) cur.draw(performance.now()); tapH(x,y); });
  pN.appendChild(cN);
  const updDet=()=>{ det.querySelector('.lab').textContent=`DETECTION ${Math.round(R.det)}%`; det.querySelector('i').style.width=R.det+'%'; det.classList.toggle('hot',R.det>=70); };
  const addDet=x=>{ R.det=Math.min(100,R.det+x); save(); updDet(); if(R.det>=100){ fail(); return true; } return false; };
  const btn=(b,txt,fn)=>{ b.textContent=txt; b.style.display=''; b.disabled=false; b.onclick=fn; };
  const hide=()=>{ bAct.style.display='none'; bAlt.style.display='none'; };
  function fail(){ locked=true; tapH=null; qbox.innerHTML=''; info.className='fb no'; info.innerHTML=`> TRACE DETECTED. VERA cut the connection.<br>> retry phase ${R.ph} from its start (−${FAIL} XP at the end).`; hide();
    btn(bAct,'↻ RETRY PHASE',()=>{ R.fails++; R.det=Math.min(R.cp,50); save(); updDet(); startPhase(); }); }
  function win(pts,msg){ locked=true; tapH=null; R.sc[R.ph-1]=pts; save(); info.className='fb ok'; info.innerHTML=`${msg}<br>> phase ${R.ph}: <b>+${pts}</b>`; tex(info); hide();
    btn(bAct, R.ph<6?`PHASE ${R.ph+1} ▸`:'MISSION REPORT ▸', ()=>{ R.ph++; save(); if(R.ph>6) finish(); else startPhase(); }); }
  function startPhase(){ bAlt.className=''; bAct.className='btn-main'; locked=false; R.cp=R.det; save(); updDet(); dbg('P'+R.ph); tag.textContent=`PHASE ${R.ph}/6`; qbox.innerHTML=''; info.className='fb info'; info.textContent=''; hide();
    const ph=PH[R.ph](); cur.draw=ph.draw; tapH=ph.tap||null; tex(task); tex(qbox); stage.scrollTop=0; }
  const P=()=>inBox(corePos(),[0,20,C.w,C.h-26],14,1.6);
  // the same map of the Core, zoomed on a group of nodes (the rest stays in place, faded)
  const zoomP=(sub,pad=24,maxS=3.2)=>{ const B=P(); let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; sub.forEach(i=>{ const [x,y]=B[i]; x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); });
    const s_=Math.min((C.w-2*pad)/Math.max(1,x1-x0),(C.h-26-2*pad)/Math.max(1,y1-y0),maxS), cx=(x0+x1)/2, cy=(y0+y1)/2;
    return B.map(([x,y])=>[C.w/2+(x-cx)*s_, 20+(C.h-26)/2+(y-cy)*s_]); };
  const backdrop=(ctx,Z,skip)=>{ CORE.E.forEach(([a,b])=>{ if(skip(a)&&skip(b)) return; seg(ctx,Z[a],Z[b],COL.ink2,1,.12); }); Z.forEach(([x,y],i)=>{ if(!skip(i)) dot(ctx,x,y,csize(i),COL.ink2,0,.25); }); };

  // ---------- phase 1: read the network
  const ph1=()=>{ task.innerHTML=`<b>Phase 1 · read the Core.</b> Our probe sent back these statistics. Answer correctly: every wrong answer raises detection by 10%.`;
    const k=CORE.k, H=logHist(CORE.deg), E=CORE.E.length, pts=[13,12,13,12];
    const Q=[
      {q:`The Core has $N=${N}$ devices and $E=${E}$ links. What is its average degree $\\langle k\\rangle$?`, o:[(E/N).toFixed(1),(2*E/N).toFixed(1),(2*E/N/(N-1)).toFixed(3)], a:1, why:`$\\langle k\\rangle=2E/N=${k.toFixed(1)}$.`},
      {q:`The degree distribution, on log-log axes, is close to a straight line, and the biggest hub has ${CORE.kmax} links. The Core is…`, o:['a random network: Poisson degrees, no hubs','a heavy-tailed, scale-free-like network: a few hubs, many small nodes','a regular lattice: everybody has the same degree'], a:1, why:'a straight line on log-log axes is the signature of a power law.'},
      {q:`Its clustering is $C=${CORE.C.toFixed(2)}$. A random network with the same $N$ and $\\langle k\\rangle$ would have $C\\approx\\langle k\\rangle/N\\approx ${(k/N).toFixed(2)}$. So the Core…`, o:['is basically random','is full of triangles: expect tight groups','has no giant component'], a:1, why:'many closed triangles: friends of friends are friends. groups will matter.'},
      {q:`Its average distance is $L=${CORE.L.toFixed(1)}$. You will move through it seeing only your neighbours. The fastest way to cross it is…`, o:['go through the hubs: they are shortcuts to everywhere','hop at random','avoid the hubs at all costs'], a:0, why:'hubs connect distant parts of the network.'}];
    let qi=0, first=true; const sc=[];
    const show=()=>{ const it=Q[qi]; qbox.innerHTML=''; qbox.appendChild(el('div','qn',`QUESTION ${qi+1} / 4`)); qbox.appendChild(el('div','qtext',it.q)); const o=el('div','opts');
      it.o.forEach((t,j)=>{ const b=el('button',null,t); b.onclick=()=>{ if(locked) return;
        if(j===it.a){ b.className='ok'; sc.push(first?pts[qi]:0); info.className='fb ok'; info.innerHTML=`> right: ${it.why}`; tex(info); qi++; first=true;
          if(qi<4) setTimeout(()=>{ if(!locked){ show(); info.textContent=''; } },900); else { qbox.innerHTML=''; const tot=sc.reduce((a,x)=>a+x,0); win(tot,`> diagnosis: a sparse, clustered, heavy-tailed small world. hubs to travel, groups to hide in.`); } }
        else { b.className='no'; b.disabled=true; first=false; info.className='fb no'; info.textContent='> wrong. detection +10%.'; addDet(10); } };
        o.appendChild(b); }); qbox.appendChild(o); tex(qbox); };
    show();
    return {draw:t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const wide=w>=520;
      const R1=wide?[50,40,w/2-80,h-90]:[50,36,w-80,h*.5-60]; drawLogLog(ctx,R1,H,COL.amber,'degree distribution, log bins');
      const lines=[`N = ${N} devices`,`E = ${E} links`,`clustering C = ${CORE.C.toFixed(2)}`,`average distance L = ${CORE.L.toFixed(1)}`,`biggest hub: ${CORE.kmax} links`, qi>0?`⟨k⟩ = ${k.toFixed(1)}`:'⟨k⟩ = ?'];
      const x0=wide?w/2+20:30, y0=wide?60:h*.5+20, dy=wide?28:Math.min(24,(h*.5-30)/6);
      lines.forEach((s,i)=>label(ctx,s,x0,y0+i*dy,i===5?COL.amber:COL.cyan,14,'left'));
      cN.textContent='PROBE REPORT'; }}; };

  // ---------- phase 2: get in with local information only (decentralized search: hubs to travel, the cell's colour to home in)
  const ph2=()=>{ const adj=CORE.adj, d=bfs(adj,CORE.START).d[CORE.GATE];
    task.innerHTML=`<b>Phase 2 · get in.</b> You are on a peripheral device and you have <b>no map</b>: you only see the devices linked to the one you are on, with their number of links. Somewhere there is the cell's <b>gateway</b>: you will recognise it only when you are next to it. Devices of the cell answer our ping and show up <span style="color:var(--violet)">violet</span>. Tap a neighbour to hop: every hop raises detection by 4%.`;
    let at=CORE.START, prev=-1, hops=0, t0=performance.now(); const path=[at], vis=new Set([at]);
    const ring_=()=>{ const {w,h}=C, cx=w/2, cy=20+(h-26)/2, Rr=Math.min(w,h-26)*.36, nb=adj[at].slice().sort((a,b)=>h01(a,at,2)-h01(b,at,2));
      return {cx,cy,nb,pos:nb.map((v,k)=>{ const a=-Math.PI/2+2*Math.PI*k/nb.length; return [cx+Rr*Math.cos(a), cy+Rr*Math.sin(a)]; })}; };
    const upd=()=>{ info.className='fb info'; info.textContent=`> hops: ${hops} · path: ${path.length>7?'… → ':''}${path.slice(-7).join(' → ')}`; };
    upd();
    return {draw:t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const {cx,cy,nb,pos}=ring_(), f=ease(clamp((performance.now()-t0)/350,0,1)), g=.5+.5*Math.sin(t/250);
        const P2=pos.map(([x,y])=>[lerp(cx,x,f),lerp(cy,y,f)]);
        nb.forEach((v,k)=>seg(ctx,[cx,cy],P2[k],v===CORE.GATE?COL.mag:COL.cyan,1.4,.5));
        nb.forEach((v,k)=>{ const [x,y]=P2[k], r=5+1.6*Math.sqrt(CORE.deg[v]), col=v===CORE.GATE?COL.mag:T.has(v)?COL.violet:COL.cyan;
          dot(ctx,x,y,r,col,v===CORE.GATE?16:8,vis.has(v)?.45:1); label(ctx,String(CORE.deg[v]),x,y+4,COL.bg,11);
          if(v===CORE.GATE){ ring(ctx,x,y,r+5+3*g,COL.mag,2); label(ctx,'GATEWAY',x,y-r-12,COL.mag,11); }
          else if(v===prev) label(ctx,'◂ back',x,y-r-9,COL.amber,10); else if(vis.has(v)) label(ctx,'visited',x,y-r-9,COL.ink2,10); });
        const rc=5+1.6*Math.sqrt(CORE.deg[at]); dot(ctx,cx,cy,rc,T.has(at)?COL.violet:COL.amber,14); ring(ctx,cx,cy,rc+5,COL.amber,2); label(ctx,String(CORE.deg[at]),cx,cy+4,COL.bg,11);
        label(ctx,'YOU',cx,cy+rc+18,COL.amber,11);
        cN.textContent=`hops ${hops} · number = links of the device`; },
      tap:(x,y)=>{ const {nb,pos}=ring_(), b=nearest(pos,x,y,30); if(b<0) return; const v=nb[b];
        hops++; prev=at; at=v; path.push(v); vis.add(v); t0=performance.now(); upd();
        if(v===CORE.GATE){ win(Math.round(50*Math.min(1,d/hops)),`> you reached the gateway in ${hops} hops (shortest possible: ${d}). with no map, the hubs are the shortcuts: they see a big piece of the network.`); return; }
        addDet(4); }}; };

  // ---------- phase 3: who gives the orders? hidden report network, explored with random couriers (PageRank = time spent)
  const ph3=()=>{ const Tl=[...T], n=Tl.length, ix=new Map(Tl.map((v,k)=>[v,k])), D=CORE.D.map(([a,b])=>[ix.get(a),ix.get(b)]), x=ix.get(CORE.X), MAXT=5;
    const out=Array.from({length:n},()=>[]); D.forEach(([a,b])=>out[a].push(b)); const pr=pagerank(n,D);
    const indeg=d3range(n).map(i=>D.filter(([a,b])=>b===i).length), decoy=indeg.indexOf(Math.max(...indeg));
    const Ein=CORE.E.filter(([a,b])=>T.has(a)&&T.has(b)).map(([a,b])=>[ix.get(a),ix.get(b)]), lay=()=>{ const Z=zoomP(Tl); return Tl.map(i=>Z[i]); };
    task.innerHTML=`<b>Phase 3 · who gives the orders?</b> You can see who knows whom inside the cell, but not who reports to whom. Tap a member to release a <b>random courier</b> from there: it follows the reports for 60 steps (and sometimes jumps to a random member), revealing the arrows it uses. Glow = time spent on a member. ${MAXT} couriers at most, +4% detection each. When you are sure, switch to <b>ACCUSE</b> and tap the controller: the member with the highest PageRank. A wrong accusation: +15%.`;
    const vis=Array(n).fill(0), seenA=new Set(); let used=0, anim=null, mode='trace', wrong=0, done=false, bad=new Set();
    const upd=()=>{ info.className='fb info'; info.textContent=`> couriers used ${used}/${MAXT} · mode: ${mode==='trace'?'release courier':'ACCUSE'}`; };
    btn(bAct,'ACCUSE ▸',()=>{ if(done) return; mode=mode==='trace'?'accuse':'trace'; bAct.textContent=mode==='trace'?'ACCUSE ▸':'◂ BACK TO COURIERS'; upd(); }); upd();
    return {draw:t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const Z=zoomP(Tl), p=Tl.map(i=>Z[i]), now=performance.now(); backdrop(ctx,Z,i=>T.has(i));
        if(anim){ const k=Math.min(anim.path.length-1,Math.floor((now-anim.t0)/45)); while(anim.k<k){ anim.k++; const a_=anim.path[anim.k-1], b_=anim.path[anim.k]; vis[b_]++; if(!anim.tp[anim.k]) seenA.add(a_+'>'+b_); } if(anim.k>=anim.path.length-1) anim=null; }
        Ein.forEach(([a,b])=>seg(ctx,p[a],p[b],COL.ink2,1,.25));

    if(tot>prev||!(key in S.xp)){ S.xp[key]=Math.max(tot,prev); updXP(Math.max(0,tot-prev)); } save();
    task.innerHTML=`<b>Mission report.</b>`;
    info.className='fb ok'; info.innerHTML=`<table class="sumt">${NM.map((n,i)=>`<tr><td>${i+1} · ${n}</td><td>${R.sc[i]||0} / 50</td></tr>`).join('')}${R.fails?`<tr><td>traced ${R.fails}×</td><td>−${FAIL*R.fails}</td></tr>`:''}<tr><td><b>OPERATION CORE</b></td><td><b>${tot} XP</b></td></tr></table>`;
    cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h); const p=P(); CORE.E.forEach(([a,b])=>seg(ctx,p[a],p[b],COL.green,1,.3)); p.forEach(([x,y],i)=>dot(ctx,x,y,csize(i),T.has(i)?COL.dim:COL.green,4,T.has(i)?.5:1)); cN.textContent='the Core, cleaned'; };
    btn(bAlt,'↻ NEW RUN',()=>{ S.run=null; save(); go(idx); }); setNext('DEBRIEF ▸',true); }
  if(R.ph>1) det.after(el('div','badge',`↺ resumed from the checkpoint: phase ${R.ph}`));
  startPhase();
};

/* ---------------- END ---------------- */
function rankOf(x){ return x>=330?'NETWORK SCIENTIST':x>=230?'SENIOR AGENT':'FIELD AGENT'; }
BUILD.end=()=>{
  const xp=totalXP(); S.best=Math.max(S.best||0,xp); save();
  let camp=0; for(let l=1;l<=8;l++){ try{ const s=JSON.parse(localStorage.getItem('nexus-l'+l)); if(s&&s.xp) camp+=Object.values(s.xp).reduce((a,b)=>a+b,0); }catch(e){} }
  const a=el('div','anim'); a.style.height='min(34vh,300px)'; stage.appendChild(a); const C=canvasIn(a);
  const term=el('div','term'); term.style.fontSize='16px'; stage.appendChild(term);
  const rest=el('div'); rest.style.cssText='display:flex;flex-direction:column;gap:12px'; stage.appendChild(rest);
  typeLines(term,[
    `VERA: the cell is sealed. the kill-patch is everywhere.`,
    `VERA: for the first time since Helix Cloud, NEXUS is silent.`,
    `VERA: you read its map, outran its swarm, broke its hubs, found its masters, split its factions and stopped its outbreak.`,
    `> [ CAMPAIGN · PART ONE COMPLETE · ${camp} XP ]`,
    `VERA: ...one more thing. the kill-patch reported back from every device but one.`,
    `VERA: it answered with a single line: "networks never really sleep."`,
    `VERA: rest now, agent. I'll call you.`], ()=>{
    endSummary(rest, xp, rankOf(xp), [
      `<b>Lectures 1–2</b>: nodes, links, adjacency matrix; degree, $\\langle k\\rangle=2E/N$, distances, components, clustering.`,
      `<b>Lecture 3</b>: random networks, the giant component at $\\langle k\\rangle=1$, small worlds, Watts–Strogatz, robustness.`,
      `<b>Lecture 4</b>: power laws and scale-free networks, preferential attachment, robust to failures and fragile to attacks.`,
      `<b>Lecture 5</b>: degree, eigenvector, PageRank, betweenness and closeness centrality.`,
      `<b>Lecture 6</b>: communities, modularity, Girvan–Newman and Louvain, weak ties.`,
      `<b>Lecture 7</b>: SI, SIS, SIR, $R_0$, the epidemic threshold and immunization.`],
      null, 'END OF PART ONE');
  });
  // the Core turns green from the release points outwards
  let t0=null; const d=bfs(CORE.adj,CORE.GATE).d;
  cur.draw=()=>{ const {ctx,w,h}=C; if(!w) return; const now=performance.now(); if(t0===null) t0=now; const s=(now-t0)/1000; ctx.clearRect(0,0,w,h); const p=inBox(corePos(),[0,10,w,h-20],12,1.6);
    CORE.E.forEach(([a,b])=>seg(ctx,p[a],p[b],COL.cyan,1,.3)); p.forEach(([x,y],i)=>{ const ok=d[i]<=s*2; dot(ctx,x,y,csize(i),ok?COL.green:COL.mag,ok?4:10); }); };
};

start();
</script>
