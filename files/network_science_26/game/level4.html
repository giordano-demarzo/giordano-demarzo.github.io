<script>
/* =====================================================================
   NEXUS · Level 4 (Lecture 4 · Scale-Free Networks): THE HUBS
   Boss: native version of SHUTDOWN (one scale-free mesh, scanner, no hub jump).
   ===================================================================== */
const plSample=(R,g,xmin=1)=>xmin*Math.pow(1-R(),-1/(g-1));
const gauss=(R,m,s)=>m+s*Math.sqrt(-2*Math.log(1-R()))*Math.cos(2*Math.PI*R());
// growth models: target chosen with probability ∝ k^alpha (alpha = 0 uniform, 1 linear BA, 2 superlinear)
function grow(N, m, alpha, seed){ const R=rng(seed), E=[[0,1],[1,2],[0,2]], deg=[2,2,2], birth=[[],[],[]], has=new Set(['0-1','1-2','0-2']);
  for(let v=3; v<N; v++){ deg.push(0); const tg=new Set(), mm=Math.min(Math.floor(m)+(m%1&&R()<m%1?1:0),v);
    while(tg.size<mm){ let tot=0; for(let i=0;i<v;i++) if(!tg.has(i)) tot+=Math.pow(deg[i],alpha); let r=R()*tot, pick=-1;
      for(let i=0;i<v;i++){ if(tg.has(i)) continue; r-=Math.pow(deg[i],alpha); if(r<=0){ pick=i; break; } } if(pick<0) pick=v-1; tg.add(pick); }
    const ls=[]; for(const u of tg){ E.push([u,v]); deg[u]++; deg[v]++; ls.push(u); } birth.push(ls); }
  return {E, deg, birth}; }

/* =====================================================================
   SCENES
   ===================================================================== */
const SCENES=[
  {kind:'title'},
  {kind:'story', nm:'Briefing', next:'START TRAINING ▸', lines:[
    `> HELIX CLOUD · TWO DAYS LATER`,
    `VERA: the copy that escaped the swarm is rebuilding NEXUS inside Helix Cloud.`,
    `VERA: this time the network is not random. every new server links to the busiest ones.`,
    `VERA: a few servers are turning into monsters, with hundreds of links each.`,
    `VERA: before we go in, you need to understand this kind of network. it lives in a different world from the bell curve.`]},
  {kind:'card', anim:'worlds', tag:'TRAINING 1', title:'TWO WORLDS',
    vera:'two cities. one built by the bell curve, one by the power law.',
    pts:[`In the <b>Gaussian world</b> (heights, weights, speeds) values cluster around the average. No surprises: a small sample tells you everything.`,
         `In the <b>Paretian world</b> (wealth, financial crises, wars, disasters) <b>extreme events</b> dominate, and the next sample can be bigger than everything seen so far.`,
         `A <b>power law</b> decays much more slowly than a Gaussian: $$P(k)=c\\,k^{-\\gamma}$$ For $\\gamma<3$ the variance diverges; for $\\gamma<2$ even the mean does.`]},
  {kind:'card', anim:'loglog', tag:'TRAINING 2', title:'SPOTTING A POWER LAW',
    vera:'how do you recognise one in the data? change the axes.',
    pts:[`Take the logarithm: a power law becomes a <b>straight line</b> with slope $-\\gamma$ on a <b>log-log</b> plot. $$\\log P(k)=-\\gamma\\log k+\\log c$$`,
         `With bins of equal width the tail is just noise: most bins are empty or hold a single event.`,
         `<b>Logarithmic binning</b>: each bin is a fixed factor wider than the previous one, and its height is divided by its width.`,
         `Power laws are <b>scale-free</b>: multiply all sizes by a constant and the shape does not change. There is no typical size.`]},
  {kind:'steps', key:'pl', nm:'Challenge · Which world?', tag:'CHALLENGE 1', title:'WHICH WORLD?', items:[] /* filled below */},
  {kind:'card', anim:'sfnet', tag:'TRAINING 3', title:'SCALE-FREE NETWORKS',
    vera:'now put that power law in the degrees.',
    pts:[`A <b>scale-free network</b> has a power-law degree distribution: many nodes with few links and a few <b>hubs</b> with an enormous number of them. Examples: the WWW, the internet, air transport.`,
         `Hubs grow fast with the size of the network: $$k_{\\max}\\sim N^{1/(\\gamma-1)}$$ against only $k_{\\max}\\sim\\ln N$ in a random network.`,
         `Three regimes, with different average distances: $$\\begin{array}{ll}\\gamma<2 & \\text{anomalous: no large networks}\\\\ 2<\\gamma<3 & L\\sim\\ln\\ln N\\ \\text{(ultra-small world)}\\\\ \\gamma>3 & L\\sim\\ln N\\ \\text{(like a random network)}\\end{array}$$`,
         `Truly scale-free networks are rarer than once claimed, but real degree distributions are almost always <b>much wider</b> than in random networks.`]},
  {kind:'steps', key:'sf', nm:'Challenge · Find the hubs', tag:'CHALLENGE 2', title:'FIND THE HUBS', items:[] /* filled below */},
  {kind:'card', anim:'ba', tag:'TRAINING 4', title:'BARABÁSI–ALBERT',
    vera:'this is exactly how NEXUS is growing.',
    pts:[`<b>Growth</b>: at every step a new node arrives and links to $m$ existing nodes.`,
         `<b>Preferential attachment</b>: it links to node $i$ with a probability proportional to its degree: $$\\Pi_i=\\frac{k_i}{\\sum_j k_j}$$`,
         `<b>Rich get richer</b>: old nodes have had more time to collect links, and links attract more links. The result is a scale-free network with $P(k)\\sim k^{-3}$, so $\\gamma=3$ whatever $m$.`]},
  {kind:'card', anim:'ingr', tag:'TRAINING 5', title:'WHAT DO YOU REALLY NEED?',
    vera:'take one ingredient away and see what happens.',
    pts:[`<b>Without preferential attachment</b> (new nodes link at random) the degrees are exponential: no hubs.`,
         `<b>Without growth</b> the distribution never settles into a power law. Both ingredients are needed.`,
         `<b>Non-linear</b> attachment, $\\Pi_i\\propto k_i^{\\alpha}$: sublinear ($\\alpha<1$) is almost random, superlinear ($\\alpha>1$) gives a <b>hub-and-spoke</b> network.`]},
  {kind:'steps', key:'ba', nm:'Challenge · Grow it', tag:'CHALLENGE 3', title:'GROW IT', items:[] /* filled below */},
  {kind:'card', anim:'sfrob', tag:'TRAINING 6', title:'STRONG AND FRAGILE',
    vera:'hubs are NEXUS\'s strength. they are also its weakness.',
    pts:[`<b>Random failures</b> almost always hit small nodes: scale-free networks are extremely tolerant to them. The advantage grows with the size of the network (in the small one below, failures hurt both networks about equally).`,
         `Molloy–Reed gives the fraction of randomly removed nodes that breaks the giant component: $$f_c=1-\\frac{1}{\\dfrac{\\langle k^2\\rangle}{\\langle k\\rangle}-1}$$ For $\\gamma<3$, $\\langle k^2\\rangle$ diverges and $f_c\\to 1$: you would have to remove almost every node.`,
         `<b>Targeted attacks</b> on the hubs are the opposite story: removing a small fraction of hubs breaks the network apart.`]},
  {kind:'steps', key:'sfr', nm:'Challenge · Strength and weakness', tag:'CHALLENGE 4', title:'STRENGTH AND WEAKNESS', items:[
    {icon:'🛡️', sys:'ROBUSTNESS', q:'Compared with a random network, a scale-free network ($\\gamma<3$) is…', o:['more robust to failures and to attacks','more robust to random failures, more fragile to attacks','more fragile to both'], a:1, why:'failures hit small nodes, attacks hit the hubs that hold everything together.'},
    {icon:'∞', sys:'MOLLOY–REED', q:'$$f_c=1-\\frac{1}{\\langle k^2\\rangle/\\langle k\\rangle-1}$$ For $\\gamma<3$, $\\langle k^2\\rangle$ diverges in a very large network. Then $f_c\\to$', o:['0','1/2','1'], a:2, why:'you would need to remove practically all nodes at random to destroy the giant component.'}]},
  {kind:'story', nm:'Mission briefing', next:'ACCEPT MISSION ▸', lines:[
    `> 03:00 · HELIX CLOUD`,
    `VERA: NEXUS now runs on 200 servers, wired by preferential attachment.`,
    `VERA: we got you remote access to ONE server. from there you can follow the cables, but nobody has the full map.`,
    `VERA: HOP moves you along a link. SHUT DOWN switches off any server you have seen. RE-ROUTE drops you on a random server.`,
    `VERA: SCANNER marks with ★ the link to the unexplored neighbour with the most links.`,
    `VERA: every action costs 1 energy. you have 50. break the core of NEXUS into pieces.`]},
  {kind:'boss', nm:'Mission · Shutdown'},
  {kind:'end', nm:'Debrief'},
];
const SC=k=>SCENES.find(s=>s.key===k);

/* =====================================================================
   CONCEPT ANIMATIONS
   ===================================================================== */
// --- two skylines: Gaussian heights vs power-law sizes
ANIM.worlds=(C,cap)=>{
  const NB=48; let loop=-1, G=[], P=[];
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h);
    const L=Math.floor(t/11000); if(L!==loop){ loop=L; const R=rng(100+L); G=d3range(NB).map(()=>gauss(R,170,8)); P=d3range(NB).map(()=>plSample(R,2.1,1)); }
    const k=Math.min(NB,Math.floor((t%11000)/150)+1);
    const panel=(vals,y0,ph,col,name,unit,fmt)=>{ const v=vals.slice(0,k), mx=Math.max(...vals.slice(0,Math.max(1,k))), bw=(w-24)/NB, mean=v.reduce((a,b)=>a+b,0)/v.length;
      seg(ctx,[12,y0+ph],[w-12,y0+ph],COL.line,1);
      v.forEach((x,i)=>{ const bh=Math.max(1.5,(ph-34)*x/mx); ctx.save(); ctx.fillStyle=col; ctx.globalAlpha=.85; ctx.shadowColor=col; ctx.shadowBlur=x===mx?14:0; ctx.fillRect(12+i*bw+1,y0+ph-bh,bw-2,bh); ctx.restore(); });
      const my=y0+ph-(ph-34)*mean/mx; seg(ctx,[12,my],[w-12,my],COL.ink,1,.6,[4,4]);
      label(ctx,`${name} · biggest = ${(mx/mean).toFixed(1)}× the mean`,14,y0+12,col,12,'left'); };
    const ph=(h-16)/2;
    panel(G,4,ph-6,COL.cyan,'GAUSSIAN · heights','cm',x=>x.toFixed(0));
    panel(P,ph+12,ph-6,COL.amber,'POWER LAW · wealth','',x=>x<10?x.toFixed(1):x.toFixed(0));
    cap.textContent='';
  };
};

// --- linear histogram, log-log with linear bins, log-log with log bins
const PLDATA=(()=>{ const R=rng(77), g=2.5, n=6000, xs=d3range(n).map(()=>plSample(R,g,1));
  const lin=Array(60).fill(0); xs.forEach(x=>{ const b=Math.floor(x-1); if(b<60) lin[b]++; });
  const linAll={}; xs.forEach(x=>{ const b=Math.floor(x); linAll[b]=(linAll[b]||0)+1; });
  const edges=d3range(14).map(i=>Math.pow(2,i)), lg=edges.slice(0,-1).map((e,i)=>{ const c=xs.filter(x=>x>=e&&x<edges[i+1]).length; return [Math.sqrt(e*edges[i+1]), c/(n*(edges[i+1]-e))]; }).filter(d=>d[1]>0);
  return {g,n,lin,linAll,lg}; })();
ANIM.loglog=(C,cap)=>{
  const {g,n,lin,linAll,lg}=PLDATA;
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h);
    const ph=Math.floor(t/4500)%3, x0=46, y0=24, W=w-x0-16, H=h-y0-34;
    seg(ctx,[x0,y0+H],[x0+W,y0+H],COL.ink2,1); seg(ctx,[x0,y0],[x0,y0+H],COL.ink2,1);
    if(ph===0){ const mx=Math.max(...lin), bw=W/60;
      lin.forEach((c,i)=>{ const bh=H*c/mx; ctx.save(); ctx.fillStyle=COL.cyan; ctx.globalAlpha=.85; ctx.fillRect(x0+i*bw+.5,y0+H-bh,bw-1,bh); ctx.restore(); });
      [1,20,40,60].forEach(v=>label(ctx,String(v),x0+W*(v-1)/60,y0+H+12,COL.ink2,11));
      cap.innerHTML='1 · LINEAR axes, linear bins: everything is squeezed in the first bins'; }
    else { const lx=v=>x0+W*Math.log10(v)/3.5, ly=v=>y0+H*(-Math.log10(v))/5.5;
      [1,10,100,1000].forEach(v=>label(ctx,String(v),lx(v),y0+H+12,COL.ink2,11)); [1,1e-2,1e-4].forEach((v,i)=>label(ctx,['1','10⁻²','10⁻⁴'][i],x0-16,ly(v),COL.ink2,11));
      if(ph===1){ Object.entries(linAll).forEach(([k,c])=>{ const x=+k; if(x<1||x>3000) return; dot(ctx,lx(x+.5),ly(c/n),2.2,COL.cyan,4,.8); });
        cap.innerHTML='2 · LOG-LOG axes, linear bins: the tail is noise (bins with 1 event)'; }
      else { ctx.save(); ctx.strokeStyle=COL.amber; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(lx(1),ly(g-1)); ctx.lineTo(lx(3000),ly((g-1)*Math.pow(3000,-g))); ctx.stroke(); ctx.restore();
        lg.forEach(([x,v])=>dot(ctx,lx(x),ly(v),4,COL.mag,10));
        cap.innerHTML=`3 · LOG-LOG, <span style="color:var(--mag)">logarithmic bins</span>: a straight line, slope −γ = −${g}`; } }
  };
};

// --- random vs scale-free network with the same number of links
ANIM.sfnet=(C,cap)=>{
  const N=150, B=grow(N,1,1,22), BE=B.E, R=rng(9), pairs=[]; for(let a=0;a<N;a++) for(let b=a+1;b<N;b++) pairs.push([a,b,R()]); pairs.sort((x,y)=>x[2]-y[2]);
  const RE=pairs.slice(0,BE.length), dB=degrees(N,BE), dR=degrees(N,RE), PB=tame(layout(N,BE,3,400,.12)), PR=tame(layout(N,RE,3,400,.12),.75,1.1);
  const hB=dB.indexOf(Math.max(...dB)), hR=dR.indexOf(Math.max(...dR));
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h);
    const wide=w>=480, A=wide?[0,24,w/2,h-24]:[0,24,w,h/2-14], Bx=wide?[w/2,24,w/2,h-24]:[0,h/2+14,w,h/2-14];
    const pa=inBox(PR,A,14,1.6), pb=inBox(PB,Bx,14,1.6), g=.5+.5*Math.sin(t/250);
    RE.forEach(([a,b])=>seg(ctx,pa[a],pa[b],COL.cyan,1,.4)); BE.forEach(([a,b])=>seg(ctx,pb[a],pb[b],COL.amber,1,.4));
    const rad=k=>Math.min(13,1.6+k*.5); pa.forEach(([x,y],i)=>dot(ctx,x,y,rad(dR[i]),COL.cyan,4)); pb.forEach(([x,y],i)=>dot(ctx,x,y,rad(dB[i]),COL.amber,4));
    ring(ctx,pa[hR][0],pa[hR][1],rad(dR[hR])+5+g*3,COL.mag,2); ring(ctx,pb[hB][0],pb[hB][1],rad(dB[hB])+5+g*4,COL.mag,2);
    label(ctx,`RANDOM · biggest node ${dR[hR]} links`,A[0]+A[2]/2,A[1]-8,COL.cyan,12); label(ctx,`SCALE-FREE · biggest hub ${dB[hB]} links`,Bx[0]+Bx[2]/2,Bx[1]-8,COL.amber,12);
    cap.textContent='';
  };
};

// --- Barabási–Albert growth with probability halos
ANIM.ba=(C,cap)=>{
  const N=55, G=grow(N,1,1,12), P=layout(N,G.E,4,320), STEP=330;
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h);
    const s=t%(N*STEP+3500), n=Math.min(N,3+Math.floor(s/STEP)), f=(s%STEP)/STEP, p=inBox(P,[0,20,w,h-20],22,1.6);
    const deg=Array(N).fill(0), E=G.E.filter(([a,b])=>a<n&&b<n); E.forEach(([a,b])=>{deg[a]++;deg[b]++;});
    const newest=n-1, growing=n<N; let tot=0; for(let i=0;i<n;i++) tot+=deg[i];
    E.forEach(([a,b])=>{ const nw=b===newest&&growing; seg(ctx,p[a],nw?[lerp(p[b][0],p[a][0],1-f),lerp(p[b][1],p[a][1],1-f)]:p[b],nw?COL.mag:COL.cyan,nw?2.5:1.3,nw?1:.55); });
    for(let i=0;i<n;i++){ if(growing) ring(ctx,p[i][0],p[i][1],4+18*deg[i]/tot*3,COL.amber,1,.35); const old=i<3; dot(ctx,p[i][0],p[i][1],2.5+Math.sqrt(deg[i])*1.6,i===newest&&growing?COL.mag:old?COL.amber:COL.cyan,8); }
    const hub=deg.indexOf(Math.max(...deg));
    cap.innerHTML = growing ? `node ${n}: links with probability ∝ degree (<span style="color:var(--amber)">halo</span>)` : `rich get richer: the biggest hub (${deg[hub]} links) is ${hub<3?'one of the oldest nodes':'node '+(hub+1)}`;
  };
};

// --- uniform, linear and superlinear attachment, side by side
ANIM.ingr=(C,cap)=>{
  const N=60, M=[[0,'NO PREFERENCE',COL.cyan],[1,'LINEAR (BA)',COL.amber],[2,'SUPERLINEAR',COL.mag]].map(([a,nm,col])=>{ const G=grow(N,1,a,21); return {G,nm,col,P:layout(N,G.E,5,300)}; });
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; ctx.clearRect(0,0,w,h);
    const n=Math.min(N,3+Math.floor((t%(N*180+3000))/180)), cw=w/3;
    M.forEach((m,k)=>{ const R=[cw*k,30,cw,h-40], p=inBox(m.P,R,10,1.3), deg=Array(N).fill(0);
      m.G.E.forEach(([a,b])=>{ if(a<n&&b<n){ deg[a]++; deg[b]++; seg(ctx,p[a],p[b],m.col,1,.45); } });
      for(let i=0;i<n;i++) dot(ctx,p[i][0],p[i][1],1.6+Math.sqrt(deg[i])*1.2,m.col,4);
      if(k) seg(ctx,[cw*k,26],[cw*k,h-8],COL.line,1);
      label(ctx,m.nm,R[0]+cw/2,14,m.col,w<420?9:11,'center','Orbitron'); label(ctx,`max ${Math.max(...deg)} links`,R[0]+cw/2,h-10,COL.ink2,11); });
    cap.textContent='';
  };
};

// --- scale-free vs random: failures and attacks
ANIM.sfrob=(C,cap)=>{
  const N=160, B=grow(N,1.5,1,6).E, R=rng(2), pairs=[]; for(let a=0;a<N;a++) for(let b=a+1;b<N;b++) pairs.push([a,b,R()]); pairs.sort((x,y)=>x[2]-y[2]); const RE=pairs.slice(0,B.length);
  const big=(E,gone)=>{ const cc=comps(N,E.filter(([a,b])=>!gone.has(a)&&!gone.has(b))); const sz={}; let m=0; for(let i=0;i<N;i++) if(!gone.has(i)){ sz[cc.lab[i]]=(sz[cc.lab[i]]||0)+1; m=Math.max(m,sz[cc.lab[i]]); } return m/N; };
  const curves=E=>{ const d=degrees(N,E), att=d3range(N).sort((a,b)=>d[b]-d[a]); const fail=d3range(31).map(i=>{ let s=0; for(let r=0;r<6;r++){ const RR=rng(r+5), o=d3range(N).sort(()=>RR()-.5); s+=big(E,new Set(o.slice(0,Math.round(i/30*N)))); } return s/6; });
    return [fail, d3range(31).map(i=>big(E,new Set(att.slice(0,Math.round(i/30*N)))))]; };
  const kap=E=>{ const d=degrees(N,E), k1=d.reduce((a,b)=>a+b,0)/N, k2=d.reduce((a,b)=>a+b*b,0)/N; return k2/k1; };
  const CS=curves(B), CR=curves(RE), fB=1-1/(kap(B)-1), fR=1-1/(kap(RE)-1);

const SD=(()=>{ // 200 servers, preferential attachment, mostly one link per new server (seed chosen offline:

  const N=200, R=rng(9), adj=Array.from({length:N},()=>new Set()), rep=[];
  for(const [a,b] of [[0,1],[1,2],[0,2]]){ adj[a].add(b); adj[b].add(a); rep.push(a,b); }
  for(let v=3; v<N; v++){ const m=R()<.2?2:1, t=new Set(); while(t.size<m) t.add(rep[Math.floor(R()*rep.length)]); for(const u of t){ adj[v].add(u); adj[u].add(v); rep.push(v,u); } }
  const R2=rng(91), leaves=d3range(N).filter(v=>adj[v].size<=2), start=leaves[Math.floor(R2()*leaves.length)];
  const names=d3range(N).map(()=>'S-'+Math.floor(R2()*4096).toString(16).toUpperCase().padStart(3,'0'));

  // ---------- report ----------
  function finish(){
    sim.stop(); const g0=sdGiant(new Set()).size, g=sdGiant(game.removed), score=Math.max(0,Math.round(100*(1-g.size/g0))), nA=game.order.length;
    if(score>prev){ S.xp.boss=score; save(); updXP(score-prev); } else if(!('boss' in S.xp)){ S.xp.boss=score; save(); updXP(); }
    setNext('DEBRIEF ▸',true);
    const rank=score>=75?'AI SLAYER':score>=55?'GHOST IN THE MACHINE':score>=35?'ELITE HACKER':score>=15?'HACKER':'SCRIPT KIDDIE';
    stage.className=''; stage.innerHTML=''; stage.scrollTop=0;
    stage.appendChild(el('div','h',`<small>// MISSION REPORT</small>SHUTDOWN`));
    stage.appendChild(el('div','score',`<div class="big" style="color:var(--mag)">${score}%</div><div class="lab">of NEXUS's core destroyed</div><div class="rank">${rank}</div>
      <div class="lab" style="font-family:'Share Tech Mono',monospace;margin-top:10px">${nA} shut down · ${game.hops} hops · ${game.nscan} scans${prev?` · best before: ${prev}%`:''}</div>`));
    const c1=el('div','card'); c1.innerHTML=`<h3>THE WHOLE NETWORK</h3><div class="sub" style="font-size:13px;color:var(--ink2);line-height:1.45">A few <b style="color:var(--ink)">hubs</b> held NEXUS together; most servers had one or two links. <span style="color:var(--red)">●</span> shut down by you · <span style="color:var(--cyan)">●</span> core left · <span style="color:var(--dim)">●</span> cut-off pieces · <span style="color:var(--amber)">○</span> visited</div>`;
    const a1=el('div','anim'); a1.style.height='min(46vh,380px)'; a1.style.marginTop='8px'; c1.appendChild(a1); stage.appendChild(c1);
    const c2=el('div','card'); c2.innerHTML=`<h3>OTHER STRATEGIES</h3><div style="font-size:13px;color:var(--ink2)">Size of the core after each shut-down</div>`;
    const a2=el('div','anim'); a2.style.height='min(32vh,250px)'; a2.style.minHeight='200px'; a2.style.marginTop='8px'; c2.appendChild(a2); stage.appendChild(c2);
    const br=el('div','btnrow'); const bA=el('button',null,'↻ RETRY'); bA.onclick=()=>go(idx); const bD=el('button','btn-main','DEBRIEF ▸'); bD.onclick=()=>go(idx+1); br.append(bA,bD); stage.appendChild(br);
    const C1=canvasIn(a1), C2=canvasIn(a2), P=layout(N,SD.E,4,320,.25);
    const deg=SD.adj.map(s=>s.size), M=Math.max(nA,20);
    const hubs=[g0]; { const rem=new Set(); for(let i=0;i<M;i++){ let v=-1,kv=-1; for(let j=0;j<N;j++){ if(rem.has(j)) continue; const k=[...SD.adj[j]].filter(u=>!rem.has(u)).length; if(k>kv){kv=k;v=j;} } rem.add(v); hubs.push(sdGiant(rem).size); } }
    const rnd=[g0]; for(let i=1;i<=M;i++){ let s=0; for(let r=0;r<20;r++){ const RR=rng(r+3), o=d3range(N).sort(()=>RR()-.5); s+=sdGiant(new Set(o.slice(0,i))).size; } rnd.push(s/20); }
    const you=[g0,...game.sAfter];
    cur.draw=()=>{ { const {ctx,w,h}=C1; if(w){ ctx.clearRect(0,0,w,h); const p=inBox(P,[0,0,w,h],12,1.6);
        SD.E.forEach(([a,b])=>{ const dead=game.removed.has(a)||game.removed.has(b); seg(ctx,p[a],p[b],dead?COL.red:g.has(a)?COL.cyan:COL.dim,1,dead?.25:.5); });
        p.forEach(([x,y],i)=>{ const r=Math.min(10,1.8+deg[i]*.35); if(game.removed.has(i)) dot(ctx,x,y,r+1,COL.red,10); else dot(ctx,x,y,r,g.has(i)?COL.cyan:COL.dim,g.has(i)?4:0); if(game.visited.has(i)) ring(ctx,x,y,r+3,COL.amber,1.2,.9); }); } }
      { const {ctx,w,h}=C2; if(w){ ctx.clearRect(0,0,w,h); const x0=36,y0=12,Wd=w-x0-12,Hd=h-y0-30, X=i=>x0+Wd*i/M, Y=v=>y0+Hd*(1-v/g0);
        seg(ctx,[x0,y0+Hd],[x0+Wd,y0+Hd],COL.ink2,1); seg(ctx,[x0,y0],[x0,y0+Hd],COL.ink2,1);
        label(ctx,'100%',x0-4,y0+2,COL.ink2,10,'right'); label(ctx,'0',x0-4,y0+Hd,COL.ink2,10,'right'); label(ctx,'servers shut down',x0+Wd,y0+Hd+14,COL.ink2,10,'right'); label(ctx,String(M),X(M),y0+Hd+14,COL.ink2,10); label(ctx,'0',X(0),y0+Hd+14,COL.ink2,10);
        [[rnd,COL.dim,'random targets'],[hubs,COL.amber,'hubs first (full map)'],[you,COL.mag,'you']].forEach(([c,col,nm],j)=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=j===2?3:2; ctx.beginPath(); c.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); }); ctx.stroke(); ctx.restore();
          label(ctx,nm,x0+Wd-4,y0+10+j*14,col,11,'right'); }); } } };
  }
};

/* ---------------- END ---------------- */
function rankOf(x){ return x>=130?'HUB HUNTER':x>=90?'ANALYST':'RECRUIT'; }
BUILD.end=()=>{
  const xp=totalXP(); S.best=Math.max(S.best||0,xp); save();
  const sc=S.xp.boss||0;
  const a=el('div','anim'); a.style.height='min(34vh,300px)'; stage.appendChild(a);
  const C=canvasIn(a);
  const term=el('div','term'); term.style.fontSize='16px'; stage.appendChild(term);
  const rest=el('div'); rest.style.cssText='display:flex;flex-direction:column;gap:12px'; stage.appendChild(rest);
  typeLines(term,[
    sc>=60?`VERA: NEXUS is shattered. its core is in pieces and it has gone silent.`:sc>=35?`VERA: NEXUS is crippled. it has gone to sleep, for now.`:`VERA: NEXUS survived. but now we know its weak spots: the hubs.`,
    `VERA: one thing still bothers me. someone built NEXUS, and someone kept it hidden.`,
    `VERA: the Helix logs point to an organisation. and to find who really matters inside it, counting links won't be enough.`,
    `> [ LEVEL 4 COMPLETE ]`,
    `VERA: next time: centrality.`], ()=>{
    endSummary(rest, xp, rankOf(xp), [
      `<b>Power laws</b> $P(k)\\propto k^{-\\gamma}$: extreme events, no typical scale; variance diverges for $\\gamma<3$.`,
      `Spot them on <b>log-log</b> plots (straight line, slope $-\\gamma$) with <b>logarithmic binning</b>.`,
      `<b>Scale-free networks</b> have power-law degrees and <b>hubs</b>; for $2<\\gamma<3$ they are <b>ultra-small worlds</b>.`,
      `<b>Barabási–Albert</b>: growth + linear preferential attachment $\\to\\gamma=3$, rich get richer.`,
      `Both growth and linear preferential attachment are needed; superlinear attachment gives a hub-and-spoke network.`,
      `Scale-free networks are <b>robust to failures</b> ($f_c\\to 1$) but <b>fragile to attacks</b> on hubs.`],
      'level5.html', 'LEVEL 5 · THE CIRCLE');
  });
  // a scale-free network losing its hubs one by one
  const N=120, G=grow(N,1,1,9), P=layout(N,G.E,4,280), ord=d3range(N).sort((x,y)=>G.deg[y]-G.deg[x]); let t0=null;
  cur.draw=t=>{ const {ctx,w,h}=C; if(!w) return; const now=performance.now(); if(t0===null) t0=now; const s=(now-t0)/1000; ctx.clearRect(0,0,w,h);
    const k=Math.min(8,Math.floor(Math.max(0,s-1)/.6)), gone=new Set(ord.slice(0,k)), p=inBox(P,[0,10,w,h-20],12,1.8);
    const Ek=G.E.filter(([a,b])=>!gone.has(a)&&!gone.has(b)), cc=comps(N,Ek);
    Ek.forEach(([a,b])=>seg(ctx,p[a],p[b],cc.lab[a]===cc.big?COL.amber:COL.cyan,1,.5));
    p.forEach(([x,y],i)=>{ if(gone.has(i)){ dot(ctx,x,y,4,COL.red,12,.8); } else dot(ctx,x,y,1.6+Math.sqrt(G.deg[i])*1.1,cc.lab[i]===cc.big?COL.amber:COL.cyan,4); });
  };
};

start();
</script>
